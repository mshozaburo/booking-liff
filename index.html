<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจองคิวบริการ</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #06c755;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #status { font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div id="status">กำลังเชื่อมต่อ LINE...</div>

  <script>
    var LIFF_ID = "2011214483-nGIOulHC";
    var FORM_URL = "https://forms.fillout.com/t/1GZR43kBWrus";

    function redirectWithUid(uid) {
      document.getElementById("status").innerText = "เชื่อมต่อสำเร็จ กำลังเปิดฟอร์ม...";
      if (uid) {
        window.location.replace(FORM_URL + "?line_uid=" + encodeURIComponent(uid));
      } else {
        window.location.replace(FORM_URL);
      }
    }

    liff.init({ liffId: LIFF_ID })
      .then(function() {
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        // ดึง UID จาก Context ของแอป LINE โดยตรง (เร็วและไม่ติดขัด)
        var context = liff.getContext();
        if (context && context.userId) {
          redirectWithUid(context.userId);
          return;
        }

        // สำรอง: ดึงจาก Profile หากเปิดจากภายนอก
        liff.getProfile()
          .then(function(profile) {
            redirectWithUid(profile.userId);
          })
          .catch(function() {
            redirectWithUid("");
          });
      })
      .catch(function(err) {
        // หากเกิดข้อผิดพลาดใดๆ ให้ส่งเข้าฟอร์มหลักทันที
        redirectWithUid("");
      });
  </script>
</body>
</html>
