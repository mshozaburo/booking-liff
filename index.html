<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจองคิวบริการ</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #06c755;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #status { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    #log { font-size: 13px; color: #64748b; max-width: 90%; word-break: break-all; }
  </style>
</head>
<body>
  <div class="spinner" id="loader"></div>
  <div id="status">กำลังเชื่อมต่อ LINE...</div>
  <div id="log">เริ่มต้นระบบ...</div>

  <script>
    function setLog(msg) {
      document.getElementById("log").innerText = msg;
    }

    async function start() {
      try {
        setLog("กำลังอ่านค่า LIFF ID...");
        
        // 1. Init LIFF
        await liff.init({ liffId: "2011214483-nGIOulHC" });
        setLog("Init สำเร็จ กำลังตรวจสอบสถานะการ Login...");

        // 2. ตรวจสอบการ Login
        if (!liff.isLoggedIn()) {
          setLog("กำลังพาไปหน้าเข้าสู่ระบบ LINE...");
          liff.login();
          return;
        }

        // 3. ดึง LINE User ID
        setLog("กำลังดึง Profile...");
        const profile = await liff.getProfile();
        const uid = profile.userId;

        if (uid) {
          document.getElementById("status").innerText = "ดึง LINE ID สำเร็จ!";
          setLog("UID: " + uid + " (กำลังเปิดฟอร์ม...)");
          
          setTimeout(() => {
            window.location.href = "https://forms.fillout.com/t/1GZR43kBWrus?line_uid=" + encodeURIComponent(uid);
          }, 800);
        } else {
          document.getElementById("status").innerText = "ไม่พบ User ID";
          setLog("กรุณากดเปิดผ่านแอป LINE ใหม่");
        }
      } catch (err) {
        document.getElementById("loader").style.display = "none";
        document.getElementById("status").innerText = "เกิดข้อผิดพลาด";
        document.getElementById("status").style.color = "#ef4444";
        setLog("Error: " + (err.message || JSON.stringify(err)));
      }
    }

    window.onload = start;
  </script>
</body>
</html>
