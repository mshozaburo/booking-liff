<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำลังพาไปหน้าจองคิว...</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f7f7f7; }
    .loader { text-align: center; color: #555; }
  </style>
</head>
<body>
  <div class="loader">
    <h3>กำลังพาไปหน้าจองคิวบริการ...</h3>
  </div>

  <script>
    async function main() {
      try {
        await liff.init({ liffId: "2011214483-nGIOulHC" });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        const userId = profile.userId;
        window.location.replace("https://forms.fillout.com/t/1GZR43kBWrus?line_uid=" + encodeURIComponent(userId));
      } catch (err) {
        console.error(err);
        window.location.replace("https://forms.fillout.com/t/1GZR43kBWrus");
      }
    }
    main();
  </script>
</body>
</html>
