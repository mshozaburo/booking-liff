<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจองคิวบริการ</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #06c755;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #status { font-size: 16px; font-weight: 600; }
    #err { color: #ef4444; font-size: 13px; margin-top: 10px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div id="status">กำลังเชื่อมต่อ LINE...</div>
  <div id="err"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      liff.init({ liffId: "2011214483-nGlOuIHC" })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          return liff.getProfile();
        })
        .then((profile) => {
          if (profile && profile.userId) {
            document.getElementById("status").innerText = "เชื่อมต่อสำเร็จ กำลังเปิดฟอร์ม...";
            window.location.replace("https://forms.fillout.com/t/1GZR43kBWrus?line_uid=" + encodeURIComponent(profile.userId));
          }
        })
        .catch((error) => {
          document.getElementById("status").innerText = "เกิดข้อผิดพลาด";
          document.getElementById("err").innerText = error.message || JSON.stringify(error);
        });
    });
  </script>
</body>
</html>
