<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจองคิวบริการ</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #06c755;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #msg { font-size: 16px; font-weight: 500; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div id="msg">กำลังเชื่อมต่อข้อมูลสมาชิก LINE...</div>

  <script>
    async function main() {
      try {
        await liff.init({ liffId: "2011214483-nGIOulHC", withLoginOnExternalBrowser: true });
        
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const userId = profile.userId;

        if (userId) {
          window.location.replace("https://forms.fillout.com/t/1GZR43kBWrus?line_uid=" + encodeURIComponent(userId));
        } else {
          window.location.replace("https://forms.fillout.com/t/1GZR43kBWrus");
        }
      } catch (err) {
        console.error("LIFF Init Error:", err);
        // หากเกิดข้อผิดพลาดใน In-App ให้ลองดึง Profile ตรง
        try {
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            window.location.replace("https://forms.fillout.com/t/1GZR43kBWrus?line_uid=" + encodeURIComponent(profile.userId));
            return;
          }
        } catch (e) {}
        window.location.replace("https://forms.fillout.com/t/1GZR43kBWrus");
      }
    }
    main();
  </script>
</body>
</html>
