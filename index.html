<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>กำลังโหลดระบบจองคิว...</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f8fafc; }
    .loader { text-align: center; color: #334155; }
  </style>
</head>
<body>
  <div class="loader">
    <p>กำลังเชื่อมต่อข้อมูลสมาชิก LINE...</p>
  </div>

  <script>
    async function initLiff() {
      try {
        await liff.init({ liffId: "2011214483-nGIOulHC" });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        const profile = await liff.getProfile();
        const userId = profile.userId;
        
        // เด้งไปยังหน้า Fillout พร้อมส่ง LINE ID
        window.location.replace("https://forms.fillout.com/t/1GZR43kBWrus?line_uid=" + userId);
      } catch (err) {
        console.error("LIFF Init Error: ", err);
        window.location.replace("https://forms.fillout.com/t/1GZR43kBWrus");
      }
    }
    initLiff();
  </script>
</body>
</html>
