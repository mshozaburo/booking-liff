<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจองคิวบริการ</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8fafc;
      color: #334155;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #06c755;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #status { font-size: 16px; font-weight: 600; }
    #log { font-size: 13px; color: #64748b; margin-top: 8px; word-break: break-all; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div id="status">กำลังเชื่อมต่อ LINE...</div>
  <div id="log">กรุณารอสักครู่...</div>

  <script>
    async function main() {
      try {
        const myLiffId = "2011214483-nGIOulHC";

        // ตรวจสอบก่อนว่าเปิดใน LINE In-App หรือไม่
        if (liff.isInClient()) {
          // ใน Client ไม่ต้องส่ง liffId หรือเรียก init ตรงๆ
          await liff.init();
        } else {
          // นอก Client ให้ส่ง liffId
          await liff.init({ liffId: myLiffId });
        }

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        const userId = profile.userId;

        if (userId) {
          document.getElementById("status").innerText = "เชื่อมต่อสำเร็จ!";
          window.location.replace("https://forms.fillout.com/t/1GZR43kBWrus?line_uid=" + encodeURIComponent(userId));
        } else {
          window.location.replace("https://forms.fillout.com/t/1GZR43kBWrus");
        }
      } catch (err) {
        document.getElementById("status").innerText = "เกิดข้อผิดพลาด";
        document.getElementById("log").innerText = err.message || JSON.stringify(err);
      }
    }

    window.onload = main;
  </script>
</body>
</html>
